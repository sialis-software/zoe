# Release bundles. Pushing a tag `vX.Y.Z` (made by scripts/release.sh) builds the macOS disk image, the Windows
# installer and the Linux packages, and puts them on a draft GitHub release for review. The macOS image is signed and
# notarized (secrets: docs/11-releasing.md); the Windows and Linux packages are not signed.
# The tests are not run again here: scripts/release.sh runs them before it tags, and ci.yml runs them on every push.
name: Release

on:
  push:
    tags: ["v*"]
  # A trial run of the builds from the Actions tab: the bundles are kept as run artifacts, and no release is made.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          version=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          packager=$(awk -F'"' '/^version *=/ {print $2; exit}' Packager.toml)
          echo "Cargo.toml $version, Packager.toml $packager, ref ${GITHUB_REF_NAME}"
          [ "$version" = "$packager" ] || { echo "Cargo.toml and Packager.toml disagree"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not v$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (Apple silicon and Intel)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Signing certificate and notarization key
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            # Without the secrets (a trial run, or before the Apple account is set up) the disk image is made unsigned.
            echo "::warning::No macOS signing secrets are set: the disk image is not signed (docs/11-releasing.md)"
            exit 0
          fi
          keychain="$RUNNER_TEMP/zoe-signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$identity" ]; then echo "No Developer ID Application certificate in the one given"; exit 1; fi
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ZOE_SIGN_IDENTITY=$identity"
            echo "ZOE_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "ZOE_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "ZOE_NOTARY_ISSUER=$APPLE_API_ISSUER"
            echo "ZOE_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      - name: Build, sign and notarize the app and the disk image
        run: UNIVERSAL=1 scripts/bundle-macos.sh release
      - name: Remove the keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$ZOE_KEYCHAIN" ]; then security delete-keychain "$ZOE_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - run: cargo build --release -p zoe
      - run: cargo packager --release --formats nsis -c Packager.toml
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    needs: check
    # The oldest runner, so that the program runs on as many systems as it can.
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libvulkan-dev libgtk-3-dev libssl-dev file wget squashfs-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - run: cargo build --release -p zoe
      - run: cargo packager --release --formats deb,appimage -c Packager.toml
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/*.deb
            target/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Draft the release
    if: github.ref_type == 'tag'
    needs: [check, macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: The changelog of this version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VERSION" > notes.md
          ls -l bundles
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/* \
            --draft --verify-tag \
            --title "Zoe ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
